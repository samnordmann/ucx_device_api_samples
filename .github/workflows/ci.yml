name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make wget
      - name: Build
        run: |
          make -n || true
      - name: Lint markdown
        uses: avto-dev/markdown-lint@v1


